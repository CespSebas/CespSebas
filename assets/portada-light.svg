    @keyframes aparecer { to { opacity: 1; } }
    @keyframes pulso { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 0; transform: scale(2.2); } }
    @media (prefers-reduced-motion: reduce) { .serie { stroke-dashoffset: 0; animation: none; } .p { opacity: 1; animation: none; } .pulso { animation: none; opacity: 0; } }
